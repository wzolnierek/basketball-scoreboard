<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div id="scoreboard">
                <div>
                    <h3>HOME</h3>
                    <p class="score" id="home-score">0</p>
                    <div>
                        <button class="home-btn" onclick="addScoreHome(1)">+1</button>
                        <button class="home-btn" onclick="addScoreHome(2)">+2</button>
                        <button class="home-btn" onclick="addScoreHome(3)">+3</button>
                    </div>
                </div>
                <div>
                    <h3>AWAY</h3>
                    <p class="score" id="guest-score">0</p>
                    <div>
                        <button class="guest-btn" onclick="addScoreGuest(1)">+1</button>
                        <button class="guest-btn" onclick="addScoreGuest(2)">+2</button>
                        <button class="guest-btn" onclick="addScoreGuest(3)">+3</button>
                    </div>
                </div>
            </div>
            <div>
                <button id="reset-btn" onclick="resetScore()">RESET</button>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
